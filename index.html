    <!--
      Critical boot styles — paint before the JS bundle and Tailwind's CSS
      arrive, so the first frame is the dark background and a loading mark
      rather than a flash of white.
    -->
    <style>
      html,
      body {
        background-color: #0b0a08;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #0b0a08;
        background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(47, 158, 110, 0.08), transparent 60%);
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .mark {
        display: flex;
        gap: 4px;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        font-size: 18px;
      }
      #initial-loader .mark span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 5px;
        color: #0b0a08;
        animation: sc-hop 1.2s ease-in-out infinite;
      }
      #initial-loader .mark span:nth-child(odd) { background: #2f9e6e; }
      #initial-loader .mark span:nth-child(even) { background: #c9922f; }
      #initial-loader .mark span:nth-child(2) { animation-delay: 0.1s; }
      #initial-loader .mark span:nth-child(3) { animation-delay: 0.2s; }
      #initial-loader .mark span:nth-child(4) { animation-delay: 0.3s; }
      #initial-loader .mark span:nth-child(5) { animation-delay: 0.4s; }
      #initial-loader .mark span:nth-child(6) { animation-delay: 0.5s; }
      #initial-loader .mark span:nth-child(7) { animation-delay: 0.6s; }
      #initial-loader .mark span:nth-child(8) { animation-delay: 0.7s; }
      #initial-loader .caption {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #978c79;
      }
      @keyframes sc-hop {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .mark span { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#0b0a08] text-paper antialiased">
    <div id="initial-loader" aria-live="polite" aria-label="Loading Wordezy Scramble">
      <div class="mark"><span>S</span><span>C</span><span>R</span><span>A</span><span>M</span><span>B</span><span>L</span><span>E</span></div>
      <div class="caption">Jumbling today's words&hellip;</div>
    </div>
    <div id="root"></div>
    <noscript>
      <h1>Wordezy Scramble — a free daily word unscramble game</h1>

        Every day there are five scrambled words to solve, from 4 letters up to 8. Tap or type the letters to spell each

      </p>
      <p>More free games: <a href="https://wordezy.bgameworld.com/">Wordezy</a>, <a href="https://wordezysearch.bgameworld.com/">Wordezy Search</a>, <a href="https://whenandwhere.bgameworld.com/">When &amp; Where</a>.</p>
    </noscript>
